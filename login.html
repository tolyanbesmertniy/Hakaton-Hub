<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Хакатон Хаб — Вход через Электронный студенческий</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-badge">Х</span>
        <span class="brand-name">Хакатон Хаб</span>
      </a>

      <nav class="nav-tabs">
        <a href="index.html" class="tab-item">📅 Афиша</a>
        <a href="registrations.html" class="tab-item">
          🎟️ Мои регистрации
          <span class="nav-counter" id="nav-reg-count">0</span>
        </a>
      </nav>

      <div class="user-panel" id="user-panel"></div>
    </div>
  </header>

  <main class="container auth-page-wrapper">
    <div class="auth-card">
      <div class="eyebrow">ЭЛЕКТРОННЫЙ СТУДЕНЧЕСКИЙ ID</div>
      <h1 class="auth-title">Вход в профиль</h1>
      <p class="auth-subtitle">Данные студента, статус обучения и кошелёк «Шабурята» загружаются из системы Электронного студенческого</p>

      <form id="page-login-form" class="auth-form">
        <div class="form-group">
          <label for="login-name">ФИО студента (как в студенческом)</label>
          <input type="text" id="login-name" placeholder="Например: Маслов Максим" required />
        </div>
        <div class="form-group">
          <label for="login-group">Номер группы</label>
          <input type="text" id="login-group" placeholder="Например: 2ИП-7-25" required />
        </div>
        <button type="submit" class="btn-cta">Войти по студенческому билету</button>
      </form>

      <div class="demo-accounts">
        <div class="demo-label">Профиль из базы Электронного студенческого:</div>
        <div class="demo-list">
          <button type="button" class="demo-btn" id="btn-sync-student-card">
            🪪 Загрузить профиль из Электронного студенческого
          </button>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
