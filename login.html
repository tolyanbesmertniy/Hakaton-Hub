<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Хакатон Хаб — Вход в аккаунт</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-badge">Х</span>
        <span class="brand-name">Хакатон Хаб</span>
      </a>

      <nav class="nav-tabs">
        <a href="index.html" class="tab-item">📅 Афиша</a>
        <a href="registrations.html" class="tab-item">
          🎟️ Мои регистрации
          <span class="nav-counter" id="nav-reg-count">0</span>
        </a>
      </nav>

      <div class="user-panel" id="user-panel"></div>
    </div>
  </header>

  <main class="container auth-page-wrapper">
    <div class="auth-card">
      <div class="eyebrow">COLLEGE PLATFORM ID</div>
      <h1 class="auth-title">Вход в аккаунт</h1>
      <p class="auth-subtitle">Войдите, чтобы записываться на мероприятия и копить Шабурята</p>

      <form id="page-login-form" class="auth-form">
        <div class="form-group">
          <label for="login-name">Имя и фамилия</label>
          <input type="text" id="login-name" placeholder="Например: Мария Иванова" required />
        </div>
        <div class="form-group">
          <label for="login-group">Номер группы</label>
          <input type="text" id="login-group" placeholder="Например: 1XX-1-11" required />
        </div>
        <button type="submit" class="btn-cta">Войти в аккаунт</button>
      </form>

      <div class="auth-switch-link">
        Ещё нет учётной записи? <a href="register.html">Зарегистрироваться</a>
      </div>

      <div class="demo-accounts">
        <div class="demo-label">Быстрый вход в тестовый аккаунт:</div>
        <div class="demo-list">
          <button type="button" class="demo-btn" data-name="Мария Иванова" data-group="1ИС-2-24">
            Мария Иванова (гр. 1ИС-2-24 • 24 🪙)
          </button>
          <button type="button" class="demo-btn" data-name="Дмитрий Соколов" data-group="2ПМ-1-23">
            Дмитрий Соколов (гр. 2ПМ-1-23 • 10 🪙)
          </button>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
